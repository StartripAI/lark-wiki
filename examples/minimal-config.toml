# Copy selected sections into state/llm_wiki_v1.local.toml.
# Keep workspace credentials, private identifiers, and local paths under state/.

[llm]
provider = "disabled"
model = "gpt-5.4-mini"
command = ""
timeout_seconds = 180
max_assets_per_prompt = 6
max_chars_per_asset = 3500
semantic_lint_enabled = true

[runtime]
lark_cli_version = "1.0.19"
optional_sidecars = "user_configured"

[projects.personal_kb]
namespace_key = "project::personal_kb"
display_name = "Personal Knowledge Base"
slug = "personal_kb"
kind = "project"
target_root_title = "Personal Knowledge Base"
title_keywords = ["personal", "notes", "research"]
local_roots = ["demo/agent_workspace_assets"]
wiki_seed_nodes = []
base_tokens = []
